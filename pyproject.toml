[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ecoloop-building-agents"
version = "0.1.0"
description = "Guardrailed local-LLM supervisory control for EnergyPlus buildings"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "EcoLoop Building Agents Team" }]
keywords = ["energyplus", "building-controls", "mcp", "ollama", "energy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1,<1",
  "mcp[cli]>=1.27,<2",
  "ollama>=0.5,<1",
  "pandas>=2.2,<3",
  "pdfplumber>=0.11,<1",
  "plotly>=6.0,<7",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=5.7,<6",
  "python-dotenv>=1.1,<2",
  "reportlab>=4.4,<5",
  "rich>=14.0,<15",
  "streamlit>=1.46,<2",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-python-dateutil>=2.9.0.20250516",
]

[project.scripts]
ecoloop = "ecoloop.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ecoloop"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["runs", "submission", "tmp", "presentation/build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "ASYNC", "C4", "DTZ", "PTH"]
ignore = [
  "S101", # assertions are expected in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PTH"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
exclude = ["runs/", "submission/", "tmp/", "presentation/build/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["plotly.*", "streamlit.*", "pandas.*", "reportlab.*", "ollama.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
markers = [
  "integration: protocol or multi-component integration test",
  "real_energyplus: requires EnergyPlus 26.1.0 and configured real assets",
  "real_ollama: requires a running Ollama API and configured local model",
  "real_closed_loop: requires EnergyPlus, Ollama, model, and weather",
]
